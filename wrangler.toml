name = "bulk-order-coop"
main = "server/worker.ts"
compatibility_date = "2025-02-28"

[assets]
directory = "./build"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "bulk-order-coop-db"
database_id = "4661c379-59f1-4a01-980b-73a443ee562b"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "CATALOGUE_KV"
id = "0a32ccb8abb44721a30b7d3ede351c5a"
